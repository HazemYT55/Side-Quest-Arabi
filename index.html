<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Side Quest</title>
  
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/SideChat.css">
  <link rel="stylesheet" href="css/SidePosts.css">
  <link rel="stylesheet" href="css/Contact.css">
  <link rel="stylesheet" href="css/SideSettings.css">
</head>
<body>

  <!-- ================= AUTH SCREEN ================= -->
  <div id="auth-screen" class="screen active">
    <div class="auth-box">
      <h2>Side Quest</h2>
      <div class="auth-tabs">
        <div id="tab-login" class="auth-tab active" onclick="switchAuth('login')">Login</div>
        <div id="tab-signup" class="auth-tab" onclick="switchAuth('signup')">Sign Up</div>
      </div>
      <input type="text" id="auth-code" placeholder="Invite Code" class="hidden">
      <input type="text" id="auth-username" placeholder="Username" class="hidden">
      <input type="email" id="auth-email" placeholder="Email">
      <input type="password" id="auth-password" placeholder="Password">
      <button id="auth-btn" onclick="logIn()" class="btn-primary">Login</button>
    </div>
  </div>

  <!-- ================= HOME SCREEN (PHONE ICONS) ================= -->
  <div id="home-screen" class="screen">
    <div class="home-wallpaper" id="phone-wallpaper">
      
      <div class="home-time">
        <h1 id="clock">12:00</h1>
        <p id="date-display">Monday, Jan 1</p>
      </div>

      <div class="app-grid">
        <div class="app-icon" onclick="openApp('chat')">
          <div class="icon-box bg-whatsapp">💬</div>
          <span>Side Chat</span>
        </div>
        <div class="app-icon" onclick="openApp('posts')">
          <div class="icon-box bg-x">𝕏</div>
          <span>Side Posts</span>
        </div>
        <div class="app-icon" onclick="openApp('contacts')">
          <div class="icon-box bg-blue">👥</div>
          <span>Contacts</span>
        </div>
        <div class="app-icon" onclick="openApp('settings')">
          <div class="icon-box bg-gray">⚙️</div>
          <span>Settings</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= APP SCREEN ================= -->
  <div id="app-screen" class="screen">
    <div class="app-navbar">
      <button onclick="goHome()" class="btn-back">←</button>
      <span id="app-title">App</span>
    </div>

    <!-- SIDE CHAT -->
    <div id="view-chat" class="view">
      <div id="chat-messages" class="chat-box"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Message team...">
        <button onclick="sendMessage()" class="btn-send">➤</button>
      </div>
    </div>

    <!-- PRIVATE CHAT -->
    <div id="view-private-chat" class="view">
      <div id="private-chat-messages" class="chat-box"></div>
      <div class="chat-input-area">
        <input type="text" id="private-chat-input" placeholder="Message privately...">
        <button onclick="sendPrivateMessage()" class="btn-send">➤</button>
      </div>
    </div>

    <!-- SIDE POSTS -->
    <div id="view-posts" class="view">
      <div class="post-input-area">
        <textarea id="post-content" rows="2" placeholder="What's happening?"></textarea>
        <div class="post-actions">
          <input type="file" id="post-media" accept="image/*,video/*">
          <button onclick="createPost()" class="btn-post">Post</button>
        </div>
        <div id="upload-error" style="color: #ff4d4d; font-size: 12px; margin-top: 5px; font-weight: bold;"></div>
      </div>
      <div id="posts-feed" class="feed-box"></div>
    </div>

    <!-- CONTACTS -->
    <div id="view-contacts" class="view">
      <div class="contacts-list" id="contacts-list"></div>
    </div>

    <!-- SETTINGS -->
    <div id="view-settings" class="view">
      <div class="settings-menu">
        <h3>Account</h3>
        <div class="profile-card">
          <p>Logged in as: <b id="settings-username">User</b></p>
          <p>Email: <b id="settings-email">email</b></p>
        </div>
        
        <h3 style="margin-top: 20px;">Wallpaper</h3>
        <input type="text" id="wallpaper-input" placeholder="Paste image URL here...">
        <button onclick="saveWallpaper()" class="btn-primary">Save Wallpaper</button>
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <button onclick="logout()" class="btn-logout">Log Out</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
