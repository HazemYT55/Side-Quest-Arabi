<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Quest Arabi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Simple Name Login -->
  <div id="login-screen" style="display: flex; height: 100vh; align-items: center; justify-content: center; flex-direction: column;">
    <h2>Side Quest Arabi</h2>
    <p>Who are you?</p>
    <input type="text" id="name-input" placeholder="e.g. Moaz" style="margin-bottom: 10px; padding: 10px; width: 200px;">
    <button onclick="setUser()" style="padding: 10px 20px; background: #25D366; color: white; border: none; border-radius: 5px; width: 222px; cursor: pointer;">Enter</button>
  </div>

  <!-- Main App -->
  <div id="app-screen" style="display: none; height: 100vh; flex-direction: column;">
    <div class="tabs">
      <div class="tab active" data-view="chat">Chat</div>
      <div class="tab" data-view="posts">Feed (X)</div>
      <div class="tab" onclick="localStorage.clear(); location.reload();">Logout</div>
    </div>

    <div id="chat-view" class="view active">
      <div id="chat-messages"></div>
      <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <div id="posts-view" class="view">
      <div id="posts-feed"></div>
      <div id="post-input-area">
        <textarea id="post-content" rows="2" placeholder="What's happening?"></textarea>
        <input type="file" id="post-media" accept="image/*,video/*">
        <button onclick="createPost()">Post</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
