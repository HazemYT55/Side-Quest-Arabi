<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Side Quest</title>
  
  <!-- CSS LINKS -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/SideChat.css">
  <link rel="stylesheet" href="css/SidePosts.css">
  <link rel="stylesheet" href="css/Contact.css">
  <link rel="stylesheet" href="css/SideSettings.css">
</head>
<body>

  <!-- ================= AUTH SCREEN ================= -->
  <div id="auth-screen" class="screen active">
    <div class="auth-box">
      <h2>Side Quest</h2>
      <div class="auth-tabs">
        <div id="tab-login" class="auth-tab active" onclick="switchAuth('login')">Login</div>
        <div id="tab-signup" class="auth-tab" onclick="switchAuth('signup')">Sign Up</div>
      </div>
      <input type="text" id="auth-code" placeholder="Invite Code (Check your email)" class="hidden">
      <input type="text" id="auth-username" placeholder="Username (e.g. Moaz)" class="hidden">
      <input type="email" id="auth-email" placeholder="Email">
      <input type="password" id="auth-password" placeholder="Password">
      <button id="auth-btn" onclick="logIn()" class="btn-primary">Login</button>
    </div>
  </div>

  <!-- ================= HOME SCREEN ================= -->
  <div id="home-screen" class="screen">
    <div class="wallpaper" id="phone-wallpaper">
      <div class="top-bar">
        <div class="time">12:00</div>
        <div class="dynamic-island"></div>
        <div class="battery">100% 🔋</div>
      </div>

      <div class="app-grid">
        <div class="app-icon" onclick="openApp('chat')">
          <div class="icon-box bg-green">💬</div>
          <span>Side Chat</span>
        </div>
        <div class="app-icon" onclick="openApp('posts')">
          <div class="icon-box bg-black">𝕏</div>
          <span>Side Posts</span>
        </div>
        <div class="app-icon" onclick="openApp('contacts')">
          <div class="icon-box bg-blue">👥</div>
          <span>Contacts</span>
        </div>
        <div class="app-icon" onclick="openApp('settings')">
          <div class="icon-box bg-gray">⚙️</div>
          <span>Settings</span>
        </div>
      </div>

      <div class="dock">
        <div class="dock-icon bg-green" onclick="openApp('chat')">💬</div>
        <div class="dock-icon bg-blue" onclick="openApp('contacts')">👥</div>
      </div>

      <div class="page-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <!-- ================= APP SCREEN ================= -->
  <div id="app-screen" class="screen">
    <div class="app-navbar">
      <button onclick="goHome()" class="btn-back">← Home</button>
      <span id="app-title">App</span>
    </div>

    <!-- SIDE CHAT (Main Team Chat) -->
    <div id="view-chat" class="view">
      <div id="chat-messages" class="chat-box"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Message team...">
        <button onclick="sendMessage()" class="btn-send">➤</button>
      </div>
    </div>

    <!-- PRIVATE CHAT (Opens from Contacts) -->
    <div id="view-private-chat" class="view">
      <div id="private-chat-messages" class="chat-box"></div>
      <div class="chat-input-area">
        <input type="text" id="private-chat-input" placeholder="Message privately...">
        <button onclick="sendPrivateMessage()" class="btn-send">➤</button>
      </div>
    </div>

    <!-- SIDE POSTS -->
    <div id="view-posts" class="view">
      <div class="post-input-area">
        <textarea id="post-content" rows="2" placeholder="What's happening?"></textarea>
        <div class="post-actions">
          <input type="file" id="post-media" accept="image/*,video/*">
          <button onclick="createPost()" class="btn-post">Post</button>
        </div>
        <div id="upload-error" style="color: red; font-size: 12px; margin-top: 5px;"></div>
      </div>
      <div id="posts-feed" class="feed-box"></div>
    </div>

    <!-- CONTACTS -->
    <div id="view-contacts" class="view">
      <div class="contacts-list" id="contacts-list"></div>
    </div>

    <!-- SETTINGS -->
    <div id="view-settings" class="view">
      <div class="settings-menu">
        <h3>Account</h3>
        <p>Logged in as: <b id="settings-username">User</b></p>
        <p>Email: <b id="settings-email">email</b></p>
        <hr>
        <h3>Phone Appearance</h3>
        <p>Wallpaper URL:</p>
        <input type="text" id="wallpaper-input" placeholder="Paste an image URL here...">
        <button onclick="saveWallpaper()" class="btn-primary" style="margin-top: 10px;">Save Wallpaper</button>
        <hr>
        <button onclick="logout()" style="background: #ff4d4d; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold;">Log Out</button>
      </div>
    </div>
  </div>

  <!-- JS LINKS -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
