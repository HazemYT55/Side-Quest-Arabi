<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Quest Arabi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= LOGIN / SIGNUP SCREEN ================= -->
  <div id="login-screen" class="screen active">
    <div class="auth-box">
      <h2>Side Quest Arabi</h2>
      
      <div class="auth-tabs">
        <div id="tab-login" class="auth-tab active" onclick="switchAuth('login')">Login</div>
        <div id="tab-signup" class="auth-tab" onclick="switchAuth('signup')">Sign Up</div>
      </div>

      <input type="text" id="auth-username" placeholder="Username (e.g. Moaz)" class="hidden">
      <input type="email" id="auth-email" placeholder="Email">
      <input type="password" id="auth-password" placeholder="Password">
      
      <button id="auth-btn" onclick="logIn()" class="btn-primary">Login</button>
    </div>
  </div>

  <!-- ================= MAIN APP SCREEN ================= -->
  <div id="app-screen" class="screen">
    
    <!-- TOP NAVIGATION -->
    <div class="navbar">
      <div class="nav-tab active" data-view="chat" onclick="switchView('chat')">Chat</div>
      <div class="nav-tab" data-view="feed" onclick="switchView('feed')">Feed (X)</div>
      <div class="nav-tab" onclick="logout()">Logout</div>
    </div>

    <!-- CHAT PAGE -->
    <div id="view-chat" class="view active">
      <div id="chat-messages" class="chat-box"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type a message...">
        <button onclick="sendMessage()" class="btn-send">Send</button>
      </div>
    </div>

    <!-- FEED PAGE -->
    <div id="view-feed" class="view">
      <div class="post-input-area">
        <textarea id="post-content" rows="2" placeholder="What's happening?"></textarea>
        <div class="post-actions">
          <input type="file" id="post-media" accept="image/*,video/*">
          <button onclick="createPost()" class="btn-post">Post</button>
        </div>
      </div>
      <div id="posts-feed" class="feed-box"></div>
    </div>

  </div>

  <!-- LINK TO JAVASCRIPT -->
  <script type="module" src="app.js"></script>
</body>
</html>
